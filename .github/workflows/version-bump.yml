name: Automatic Version Bump

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Clean workspace
        run: git clean -fdx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Commitizen
        run: pip install commitizen

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Commitizen bump
        id: cz_bump
        run: |
          # Disable automatic exit on error to handle return codes manually
          set +e 
          
          # Run bump. 
          # Exit code 0  = Successful Bump
          # Exit code 21 = No bumpable commits (skipped)
          # Exit code 3  = No commits found (skipped)
          cz bump --yes --changelog
          exit_code=$?
          
          if [ $exit_code -eq 0 ]; then
            echo "Bump successful!"
            echo "bumped=true" >> $GITHUB_OUTPUT
            exit 0
          elif [ $exit_code -eq 21 ]; then
            echo "No bumpable commits (Exit code 21). Skipping."
            echo "bumped=false" >> $GITHUB_OUTPUT
            exit 0
          elif [ $exit_code -eq 3 ]; then
             echo "No commits found (Exit code 3). Skipping."
             echo "bumped=false" >> $GITHUB_OUTPUT
             exit 0
          else
            echo "Commitizen failed with exit code $exit_code"
            exit 1
          fi

      - name: Debug - Show status and diff
        run: |
          echo "Status after bump:"
          git status
          echo "Diff of changelog:"
          git diff HEAD -- CHANGELOG.md || echo "Changelog not found in diff"

      - name: Push changes and tags
        if: steps.cz_bump.outputs.bumped == 'true'
        run: |
          # Explicitly push the current commit (HEAD) AND all tags
          git push origin HEAD --tags
